name: moodtube
description: "MoodTube - Find long YouTube music playlists by mood"
publish_to: "none"
version: 0.3.4+6
license: MIT

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  youtube_player_flutter: ^9.1.1
  google_mobile_ads: ^5.2.0
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.4
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
